<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
King's Parking | Register
</title>

<link rel="stylesheet" href="css/login.css">

</head>


<body>


<div class="auth-box">


<h1>
🚘 Create Account
</h1>


<form id="registerForm">


<input 
type="text"
id="name"
placeholder="Full Name"
required>


<input 
type="email"
id="email"
placeholder="Email Address"
required>


<input 
type="tel"
id="phone"
placeholder="Phone Number"
required>



<input 
type="password"
id="password"
placeholder="Password"
required>



<select id="role">


<option value="driver">
Driver
</option>


<option value="admin">
Admin
</option>


</select>



<button type="submit">
Register
</button>


</form>



<p>

Already have an account?

<a href="login.html">
Login
</a>

</p>



</div>



<script src="js/auth.js"></script>

</body>

</html>
