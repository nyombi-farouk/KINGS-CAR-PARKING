<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Driver Dashboard | King's Parking
</title>

<link rel="stylesheet" href="css/dashboard.css">

</head>


<body>


<header class="dashboard-header">


<h2>
🚘 King's Parking Driver Portal
</h2>


<button onclick="logout()">
Logout
</button>


</header>





<main class="dashboard">



<!-- PROFILE -->


<section class="card profile">


<h2>
Driver Profile
</h2>


<div id="profileInfo">

</div>


</section>







<!-- PARKING SLOTS -->


<section class="card">


<h2>
Available Parking Slots
</h2>


<div id="slotsContainer"
class="slots">

</div>


</section>







<!-- BOOKINGS -->


<section class="card">


<h2>
My Booking History
</h2>


<div id="bookingList">

</div>


</section>




</main>





<script src="js/driver.js"></script>


</body>

</html>
